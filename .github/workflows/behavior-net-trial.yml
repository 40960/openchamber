name: behavior net (trial)

# A trial, not a check anyone depends on: plays the whole behavior net on a
# Linux runner to learn how long it takes there and what is red. Runs by hand
# and on pushes to its own branch.
on:
  workflow_dispatch:
  push:
    branches: [ci/behavior-net-trial]

concurrency:
  group: behavior-net-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  net:
    name: net ${{ matrix.part }}/6
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Machine
        run: |
          nproc
          free -g | head -2
          google-chrome --version
          git --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Play the net
        run: bun run verify -- --shard ${{ matrix.part }}/6
      - name: Keep the run's artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behavior-net-${{ matrix.part }}
          path: |
            tmp/verify/**/summary.json
            tmp/verify/**/result.json
            tmp/verify/**/failure.png
            tmp/verify/**/logs/**
          retention-days: 7
